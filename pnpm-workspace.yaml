packages:
  - "apps/*"
  - "packages/*"
  - "packages/test-utils"

# Mastra CLI / @mastra/deployer bundle the config with the `typescript-paths`
# rollup plugin, which only supports TypeScript <= 6 (it calls ts.sys /
# ts.readConfigFile / ts.findConfigFile, all removed in TS 7). The workspace
# is on TS 7, so the patch below makes the plugin degrade gracefully (alias
# resolution disabled) instead of crashing when `mastra dev` is run.
patchedDependencies:
  typescript-paths@1.5.2: patches/typescript-paths@1.5.2.patch

# Sentry transitively pulls @opentelemetry/api 1.9.0, while drizzle-orm wants
# 1.9.1. Pinning here forces a single copy across the workspace. The js-yaml,
# nanoid, and shell-quote pins apply the patched releases for their advisories.
overrides:
  "@opentelemetry/api": "1.9.1"
  "@auth/core": "0.41.3"
  postcss: "8.5.23"
  fast-uri: "3.1.5"
  shell-quote: "1.9.0"
  protobufjs: "7.6.5"
  js-yaml: "4.3.1"
  "nanoid@3": "3.3.18"
  "brace-expansion@^1.0.0": "1.1.18"
  "brace-expansion@^5.0.0": "5.0.9"

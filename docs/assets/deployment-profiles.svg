<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgObs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141516" />
      <stop offset="100%" stop-color="#0d0e10" />
    </linearGradient>
    <linearGradient id="cardSurf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d1e20" />
      <stop offset="100%" stop-color="#151618" />
    </linearGradient>
    <linearGradient id="emberTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3616" />
      <stop offset="100%" stop-color="#ff632a" />
    </linearGradient>
    <linearGradient id="bullTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f9e3d" />
      <stop offset="100%" stop-color="#52b750" />
    </linearGradient>
    <linearGradient id="infoTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fa3b5" />
      <stop offset="100%" stop-color="#6bc0d2" />
    </linearGradient>
    <filter id="cardSh" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.6px; fill: #ff3616; }
    .hdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #e5e5e5; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #e5e5e5; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #9a9b9e; }
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #e5e5e5; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #8a8b8e; }
    .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Outer Chassis -->
  <rect width="920" height="390" rx="16" fill="url(#bgObs)" stroke="#2c2c2c" stroke-width="1.5" />
  <line x1="16" y1="1.5" x2="904" y2="1.5" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <text x="28" y="26" class="eyebrow">DATA SOVEREIGNTY &amp; MULTI-TENANT RLS</text>
  <text x="28" y="46" class="hdr">Kestrel Self-Hosted &amp; Local Execution Profiles</text>

  <!-- PROFILE 1: 1-CLICK DOCKER STACK (PRIMARY) -->
  <g transform="translate(26, 64)" filter="url(#cardSh)">
    <rect width="276" height="302" rx="12" fill="url(#cardSurf)" stroke="#441c14" stroke-width="1.5" />
    <rect x="0" y="0" width="276" height="4" rx="2" fill="url(#emberTop)" />
    <text x="18" y="30" class="title">1-Click Docker Stack</text>
    <rect x="184" y="15" width="76" height="20" rx="10" fill="#0d0e10" stroke="#ff3616" stroke-width="1" />
    <text x="222" y="29" text-anchor="middle" class="badge" fill="#ff3616">RECOMMENDED</text>
    <text x="18" y="48" class="subtitle">Complete production self-hosted stack</text>
    <line x1="18" y1="58" x2="258" y2="58" stroke="#262729" />

    <rect x="18" y="70" width="240" height="44" rx="8" fill="#0d0e10" stroke="#262729" />
    <text x="30" y="88" class="item-title">Next.js 16 Studio + Worker Daemon</text>
    <text x="30" y="104" class="item-desc">Web (:3000) + 8 Crons, Queues &amp; Streams</text>

    <rect x="18" y="122" width="240" height="44" rx="8" fill="#0d0e10" stroke="#262729" />
    <text x="30" y="140" class="item-title">PostgreSQL 16 + pgvector + RLS</text>
    <text x="30" y="156" class="item-desc">kestrel_app (NOBYPASSRLS) tenant isolation</text>

    <rect x="18" y="174" width="240" height="44" rx="8" fill="#0d0e10" stroke="#262729" />
    <text x="30" y="192" class="item-title">Automated pg_dump Backup Sidecar</text>
    <text x="30" y="208" class="item-desc">Daily verified archives + 7-day retention</text>

    <rect x="18" y="232" width="240" height="54" rx="8" fill="#0d0e10" stroke="#441c14" stroke-dasharray="3,3" />
    <text x="30" y="252" class="subtitle">Launch Command:</text>
    <text x="30" y="272" class="cmd" fill="#ff3616">$ ./docker/init-secrets.sh &amp;&amp; docker compose up -d</text>
  </g>

  <!-- PROFILE 2: LOCAL HYBRID DEV -->
  <g transform="translate(322, 64)" filter="url(#cardSh)">
    <rect width="276" height="302" rx="12" fill="url(#cardSurf)" stroke="#2c2c2c" stroke-width="1.25" />
    <rect x="0" y="0" width="276" height="4" rx="2" fill="url(#bullTop)" />
    <text x="18" y="30" class="title">Local Developer Loop</text>
    <rect x="192" y="15" width="68" height="20" rx="10" fill="#0d0e10" stroke="#3f9e3d" stroke-width="1" />
    <text x="226" y="29" text-anchor="middle" class="badge" fill="#3f9e3d">HMR + TSRS</text>
    <text x="18" y="48" class="subtitle">Host Node 22 + Docker Postgres 16</text>
    <line x1="18" y1="58" x2="258" y2="58" stroke="#262729" />

    <rect x="18" y="70" width="240" height="44" rx="8" fill="#0d0e10" stroke="#262729" />
    <text x="30" y="88" class="item-title">Zero-Build @kestrel/source Loop</text>
    <text x="30" y="104" class="item-desc">Resolves workspace TypeScript directly</text>

    <rect x="18" y="122" width="240" height="44" rx="8" fill="#0d0e10" stroke="#262729" />
    <text x="30" y="140" class="item-title">Bundled Postgres Container (:5432)</text>
    <text x="30" y="156" class="item-desc">docker compose up -d db + migrate:apply</text>

    <rect x="18" y="174" width="240" height="44" rx="8" fill="#0d0e10" stroke="#262729" />
    <text x="30" y="192" class="item-title">Sub-Second Rust Verification</text>
    <text x="30" y="208" class="item-desc">Oxlint + Oxfmt + tsrs + 8 Static Guards</text>

    <rect x="18" y="232" width="240" height="54" rx="8" fill="#0d0e10" stroke="#3f9e3d" stroke-dasharray="3,3" />
    <text x="30" y="252" class="subtitle">Launch Command:</text>
    <text x="30" y="272" class="cmd" fill="#3f9e3d">$ pnpm dev</text>
  </g>

  <!-- PROFILE 3: EXTERNAL / CLOUD POSTGRES -->
  <g transform="translate(618, 64)" filter="url(#cardSh)">
    <rect width="276" height="302" rx="12" fill="url(#cardSurf)" stroke="#2c2c2c" stroke-width="1.25" />
    <rect x="0" y="0" width="276" height="4" rx="2" fill="url(#infoTop)" />
    <text x="18" y="30" class="title">Managed Cloud / VPS</text>
    <rect x="186" y="15" width="74" height="20" rx="10" fill="#0d0e10" stroke="#4fa3b5" stroke-width="1" />
    <text x="223" y="29" text-anchor="middle" class="badge" fill="#4fa3b5">EXTERNAL DB</text>
    <text x="18" y="48" class="subtitle">Vercel / Cloud Run + Supabase / Neon</text>
    <line x1="18" y1="58" x2="258" y2="58" stroke="#262729" />

    <rect x="18" y="70" width="240" height="44" rx="8" fill="#0d0e10" stroke="#262729" />
    <text x="30" y="88" class="item-title">Split Web &amp; Worker Runtime</text>
    <text x="30" y="104" class="item-desc">Serverless Web + VPS/Container Worker</text>

    <rect x="18" y="122" width="240" height="44" rx="8" fill="#0d0e10" stroke="#262729" />
    <text x="30" y="140" class="item-title">3-Role Connection Separation</text>
    <text x="30" y="156" class="item-desc">DATABASE_URL · ADMIN_DATABASE_URL · DIRECT_URL</text>

    <rect x="18" y="174" width="240" height="44" rx="8" fill="#0d0e10" stroke="#262729" />
    <text x="30" y="192" class="item-title">Pre-Deploy Hash &amp; Role Provisioner</text>
    <text x="30" y="208" class="item-desc">predeploy-migrate.mjs + provision:app-role</text>

    <rect x="18" y="232" width="240" height="54" rx="8" fill="#0d0e10" stroke="#4fa3b5" stroke-dasharray="3,3" />
    <text x="30" y="252" class="subtitle">Provisioning Helper:</text>
    <text x="30" y="272" class="cmd" fill="#4fa3b5">$ pnpm setup --mode=external</text>
  </g>
</svg>

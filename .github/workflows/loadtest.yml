name: loadtest

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Glob for compiled k6 test files under loadtest/dist/tests/'
        default: 'loadtest/dist/tests/smoke-*.js'
        type: string
      authMode:
        description: 'Auth strategy (legacy|session)'
        default: 'legacy'
        type: choice
        options:
          - legacy
          - session
      enableFullMode:
        description: 'Run guarded Full-mode queue/worker load (real LLM cost; session auth required)'
        default: false
        type: boolean
  schedule:
    # Nightly at 3 AM UTC — offset from the existing 0 AM eval cron
    - cron: '0 3 * * *'

concurrency:
  group: loadtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6:
    name: k6 Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Install k6 deps
        working-directory: loadtest
        run: npm install

      - name: Typecheck k6 scripts
        working-directory: loadtest
        run: npm run typecheck

      - name: Build the SUT
        run: pnpm --filter @kestrel/web build

      - name: Build k6 test scripts
        working-directory: loadtest
        run: npm run build

      - name: Install k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1
        with:
          k6-version: '0.57.0'

      - name: Inspect k6 test scripts (dry-run)
        working-directory: loadtest
        run: |
          # Inspect compiled JavaScript. k6 does not transpile TypeScript or
          # resolve the .js import specifiers emitted by the TS source tree.
          # The chat guard is enabled for inspection only; no load test runs.
          for f in dist/tests/*.js; do
            k6 inspect -e K6_ENABLE_CHAT=true "$f"
          done

      # Bring up throwaway SUT with AUTH_MODE=legacy and lifted rate limits
      - name: Start throwaway SUT
        # P7: DOCKER_BUILDKIT=1 + COMPOSE_DOCKER_CLI_BUILD=1 enable BuildKit
        # so the pnpm cache mount in the Dockerfile is honoured.
        env:
          DOCKER_BUILDKIT: '1'
          COMPOSE_DOCKER_CLI_BUILD: '1'
        run: docker compose -f loadtest/docker-compose.loadtest.yml up -d --wait

      - name: Wait for SUT to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health/public > /dev/null 2>&1; then
              echo "SUT ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "SUT did not become healthy in 60s"
          exit 1

      - name: Seed users (session mode only)
        if: ${{ inputs.authMode == 'session' }}
        working-directory: loadtest
        run: K6_ALLOW_SEED=true npm run seed
        env:
          DATABASE_URL: postgres://kestrel:loadtest@localhost:5432/kestrel

      # ── Smoke tests (read-mix + write-mix) ────────────────────────
      # The write-mix smoke test (smoke-write-mix.ts) matches the
      # smoke-*.ts glob automatically.
      - name: Run k6 smoke tests (read + write mix)
        uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1
        with:
          path: ${{ inputs.test || 'loadtest/dist/tests/smoke-*.js' }}
          flags: >-
            -e K6_BASE_URL=http://localhost:3000
            -e K6_AUTH_MODE=${{ inputs.authMode || 'legacy' }}
          fail-fast: true

      # ── Average-load tests (read-mix + write-mix) ─────────────────
      # Only run on nightly schedule; workflow_dispatch users can run
      # load tests by setting the test glob explicitly.
      - name: Run k6 load tests (read-mix)
        if: ${{ github.event_name == 'schedule' }}
        uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1
        with:
          path: loadtest/dist/tests/load-read-mix.js
          flags: >-
            -e K6_BASE_URL=http://localhost:3000
            -e K6_AUTH_MODE=${{ inputs.authMode || 'legacy' }}
          fail-fast: false

      - name: Run k6 load tests (write-mix)
        if: ${{ github.event_name == 'schedule' }}
        uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1
        with:
          path: loadtest/dist/tests/load-write-mix.js
          flags: >-
            -e K6_BASE_URL=http://localhost:3000
            -e K6_AUTH_MODE=${{ inputs.authMode || 'legacy' }}
          fail-fast: false

      - name: Run guarded Full-mode queue load
        if: ${{ inputs.enableFullMode == true }}
        uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1
        with:
          path: loadtest/dist/tests/load-full-mode.js
          flags: >-
            -e K6_BASE_URL=http://localhost:3000
            -e K6_AUTH_MODE=session
            -e K6_ENABLE_FULL_MODE=true
            -e K6_FULL_MODE_VUS=2
            -e K6_FULL_MODE_ITERS=1
          fail-fast: false

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-results
          path: loadtest/results/
          retention-days: 30

      - name: Tear down SUT
        if: always()
        run: docker compose -f loadtest/docker-compose.loadtest.yml down --volumes

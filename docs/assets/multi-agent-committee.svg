<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="gradTech" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gradFund" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gradRisk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gradSent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="gradFusion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; }
    .arrow-line { stroke: #30363d; stroke-width: 2; stroke-dasharray: 4,4; }
    .arrow-head { fill: #8b949e; }
  </style>

  <!-- Background -->
  <rect width="920" height="460" rx="14" fill="#090d13" />

  <!-- STEP 1: USER INPUT -->
  <g transform="translate(30, 190)">
    <rect width="130" height="80" rx="10" fill="url(#boxBg)" stroke="#30363d" stroke-width="1.5" filter="url(#glowShadow)" />
    <text x="65" y="32" text-anchor="middle" class="node-title">💬 User Query</text>
    <text x="65" y="48" text-anchor="middle" class="node-desc">Prompt / Chart</text>
    <rect x="25" y="56" width="80" height="16" rx="8" fill="#21262d" />
    <text x="65" y="68" text-anchor="middle" class="tag" fill="#c9d1d9">XAUUSD / FX</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <path d="M 160 230 L 195 230" fill="none" stroke="#58a6ff" stroke-width="2" />
  <polygon points="195,226 203,230 195,234" fill="#58a6ff" />

  <!-- STEP 2: MODE SELECTOR ROUTER -->
  <g transform="translate(205, 175)">
    <rect width="135" height="110" rx="10" fill="url(#boxBg)" stroke="#58a6ff" stroke-width="1.5" filter="url(#glowShadow)" />
    <text x="67" y="28" text-anchor="middle" class="node-title">🎛️ Mode Router</text>
    <text x="67" y="44" text-anchor="middle" class="node-desc">Auto / Manual</text>
    <line x1="15" y1="52" x2="120" y2="52" stroke="#21262d" stroke-width="1" />
    <text x="20" y="68" class="tag" fill="#38bdf8">• Single Mode</text>
    <text x="20" y="83" class="tag" fill="#10b981">• Quick (Tech)</text>
    <text x="20" y="98" class="tag" fill="#a855f7">• Full Committee</text>
  </g>

  <!-- CONNECTORS FROM ROUTER TO 4 AGENTS -->
  <path d="M 340 210 Q 365 210, 365 70 Q 365 70, 385 70" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <polygon points="385,67 392,70 385,73" fill="#38bdf8" />

  <path d="M 340 220 Q 370 220, 370 170 Q 370 170, 385 170" fill="none" stroke="#f59e0b" stroke-width="1.5" />
  <polygon points="385,167 392,170 385,173" fill="#f59e0b" />

  <path d="M 340 240 Q 370 240, 370 290 Q 370 290, 385 290" fill="none" stroke="#10b981" stroke-width="1.5" />
  <polygon points="385,287 392,290 385,293" fill="#10b981" />

  <path d="M 340 250 Q 365 250, 365 390 Q 365 390, 385 390" fill="none" stroke="#ec4899" stroke-width="1.5" />
  <polygon points="385,387 392,390 385,393" fill="#ec4899" />

  <!-- 4 SPECIALIST AGENTS -->
  <!-- AGENT 1: TECHNICAL -->
  <g transform="translate(395, 30)">
    <rect width="180" height="80" rx="10" fill="url(#boxBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowShadow)" />
    <rect x="0" y="0" width="180" height="3" rx="1.5" fill="url(#gradTech)" />
    <text x="14" y="24" class="node-title">📐 Technical Specialist</text>
    <text x="14" y="42" class="node-desc">SMC: Order Blocks, FVG</text>
    <text x="14" y="58" class="node-desc">BOS, Liquidity, ATR, RSI</text>
    <text x="14" y="72" class="tag" fill="#38bdf8">1m → Daily Candles</text>
  </g>

  <!-- AGENT 2: FUNDAMENTAL -->
  <g transform="translate(395, 130)">
    <rect width="180" height="80" rx="10" fill="url(#boxBg)" stroke="#f59e0b" stroke-width="1.5" filter="url(#glowShadow)" />
    <rect x="0" y="0" width="180" height="3" rx="1.5" fill="url(#gradFund)" />
    <text x="14" y="24" class="node-title">🏛️ Macro &amp; Fundamental</text>
    <text x="14" y="42" class="node-desc">Fed Rates, CPI, FOMC, NFP</text>
    <text x="14" y="58" class="node-desc">FRED Indicators &amp; CFTC CoT</text>
    <text x="14" y="72" class="tag" fill="#f59e0b">Economic Calendar</text>
  </g>

  <!-- AGENT 3: RISK -->
  <g transform="translate(395, 250)">
    <rect width="180" height="80" rx="10" fill="url(#boxBg)" stroke="#10b981" stroke-width="1.5" filter="url(#glowShadow)" />
    <rect x="0" y="0" width="180" height="3" rx="1.5" fill="url(#gradRisk)" />
    <text x="14" y="24" class="node-title">🛡️ Risk &amp; Sizing Manager</text>
    <text x="14" y="42" class="node-desc">Position Math, RR Ratio</text>
    <text x="14" y="58" class="node-desc">Drawdown &amp; Ruin Guards</text>
    <text x="14" y="72" class="tag" fill="#10b981">Capital Preservation</text>
  </g>

  <!-- AGENT 4: SENTIMENT -->
  <g transform="translate(395, 350)">
    <rect width="180" height="80" rx="10" fill="url(#boxBg)" stroke="#ec4899" stroke-width="1.5" filter="url(#glowShadow)" />
    <rect x="0" y="0" width="180" height="3" rx="1.5" fill="url(#gradSent)" />
    <text x="14" y="24" class="node-title">📰 News &amp; Sentiment</text>
    <text x="14" y="42" class="node-desc">Marketaux Breaking News</text>
    <text x="14" y="58" class="node-desc">Social Momentum &amp; Bias</text>
    <text x="14" y="72" class="tag" fill="#ec4899">Real-time Web Intel</text>
  </g>

  <!-- CONNECTORS FROM 4 AGENTS TO FUSION -->
  <path d="M 575 70 Q 600 70, 600 210 Q 600 210, 615 210" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <path d="M 575 170 Q 595 170, 595 220 Q 595 220, 615 220" fill="none" stroke="#f59e0b" stroke-width="1.5" />
  <path d="M 575 290 Q 595 290, 595 240 Q 595 240, 615 240" fill="none" stroke="#10b981" stroke-width="1.5" />
  <path d="M 575 390 Q 600 390, 600 250 Q 600 250, 615 250" fill="none" stroke="#ec4899" stroke-width="1.5" />
  <polygon points="615,226 623,230 615,234" fill="#a855f7" />

  <!-- STEP 3: FUSION ORCHESTRATOR & VERIFICATION -->
  <g transform="translate(625, 175)">
    <rect width="130" height="110" rx="10" fill="url(#boxBg)" stroke="#a855f7" stroke-width="1.5" filter="url(#glowShadow)" />
    <rect x="0" y="0" width="130" height="3" rx="1.5" fill="url(#gradFusion)" />
    <text x="65" y="28" text-anchor="middle" class="node-title">🔮 Mastra Fusion</text>
    <text x="65" y="44" text-anchor="middle" class="node-desc">Synthesis Engine</text>
    <line x1="12" y1="52" x2="118" y2="52" stroke="#21262d" stroke-width="1" />
    <text x="65" y="68" text-anchor="middle" class="tag" fill="#c084fc">Cross-Check</text>
    <text x="65" y="83" text-anchor="middle" class="tag" fill="#c084fc">Citation Filter</text>
    <text x="65" y="98" text-anchor="middle" class="tag" fill="#c084fc">Budget Guard</text>
  </g>

  <!-- ARROW 3 -> 4 -->
  <path d="M 755 230 L 780 230" fill="none" stroke="#10b981" stroke-width="2" />
  <polygon points="780,226 788,230 780,234" fill="#10b981" />

  <!-- STEP 4: FINAL REPORT -->
  <g transform="translate(790, 180)">
    <rect width="105" height="100" rx="10" fill="url(#boxBg)" stroke="#10b981" stroke-width="1.5" filter="url(#glowShadow)" />
    <rect x="0" y="0" width="105" height="3" rx="1.5" fill="url(#gradRisk)" />
    <text x="52" y="28" text-anchor="middle" class="node-title">📊 Output</text>
    <text x="52" y="46" text-anchor="middle" class="node-desc">Synthesized</text>
    <text x="52" y="60" text-anchor="middle" class="node-desc">Research</text>
    <text x="52" y="78" text-anchor="middle" class="tag" fill="#34d399">Verified</text>
  </g>
</svg>

# ==============================================================================
# Kestrel — Google Cloud Always Free (e2-micro, 1 GB RAM + 2 GB Swap) Compose
# ==============================================================================
# Tuned specifically for GCP `e2-micro` (1 GB physical RAM + 2 GB swapfile).
# Runs both the heavy job scheduler (`WORKER_MODE=docker`) and the light cron
# poker (`scripts/botkeep-start.mjs`) in a single memory-bounded container.
# ==============================================================================

services:
  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
      args:
        DEPLOYED_SHA: ${DEPLOYED_SHA:-unknown}
    image: hamafx-worker:latest
    container_name: hamafx-worker
    restart: unless-stopped
    env_file:
      - /opt/hamafx/.env
    environment:
      NODE_ENV: production
      WORKER_MODE: docker
      NODE_OPTIONS: '--max-old-space-size=512'
      DEPLOYED_SHA: ${DEPLOYED_SHA:-unknown}
      WORKER_HTTP_HOST: 0.0.0.0
      WORKER_HTTP_PORT: 8081
      WORKER_PROXY_PORT: 8082
    ports:
      - '127.0.0.1:8081:8081'
      - '127.0.0.1:8082:8082'
    mem_limit: 700m
    memswap_limit: 2g
    # C4: Health check — mirrors docker-compose.vm.yml. Compose renders `$$`
    # to `$` for the container shell (the image-level probe in Dockerfile.worker
    # keeps its command verbatim and therefore uses a single `$`).
    # `/health/live` = process liveness; `/health/jobs` = no wedged job holds
    # its scheduler guard (autoheal restarts a wedged worker).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${WORKER_HEALTH_TOKEN}\" http://localhost:8081/health/live && curl -fsS -H \"Authorization: Bearer $${WORKER_HEALTH_TOKEN}\" http://localhost:8081/health/jobs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

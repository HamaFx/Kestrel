# Kestrel VM Worker Docker Compose
# Deployed to /opt/kestrel/docker-compose.yml on the GCE VM.
# Builds the worker image from the repo's Dockerfile.worker — no external registry needed.
#
# The frontend (apps/web) runs on Vercel. Supabase is external.
# This container ONLY runs the worker + internal job scheduler.

services:
  worker:
    build:
      context: /opt/kestrel/app
      dockerfile: Dockerfile.worker
    image: kestrel-worker:local
    container_name: kestrel-worker
    restart: unless-stopped

    # All secrets from /opt/kestrel/.env
    env_file:
      - /opt/kestrel/.env

    # Hardcoded env vars (override any .env values)
    environment:
      NODE_ENV: production
      WORKER_MODE: docker
      KESTREL_RUNTIME: worker

    # Keep both listeners host-private. Do not publish either port on
    # 0.0.0.0 or expose them through a public firewall rule.
    # /health requires WORKER_HEALTH_TOKEN; /biquote requires
    # BIQUOTE_PROXY_TOKEN in production.
    ports:
      - "127.0.0.1:8081:8081"   # Private health access only
      - "127.0.0.1:8082:8082"   # Private proxy access only

    # No persistent volumes — all state lives in Supabase Postgres.
    # The worker is stateless: in-memory tick buffer + candle aggregator
    # are rebuilt from provider connections on restart.

    # Health check — replaces systemd WatchdogSec
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${WORKER_HEALTH_TOKEN}\" http://localhost:8081/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Graceful shutdown — give the worker 30s to drain buffers + close WS
    stop_grace_period: 30s
    stop_signal: SIGTERM

    # Resource limits — matches current systemd MemoryMax=1.5G
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: "1.5"
        reservations:
          memory: 256m

    # Log rotation — 50MB × 3 files = 150MB max
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
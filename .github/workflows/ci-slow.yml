name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # Nightly
  workflow_dispatch:
    inputs:
      runLiveEval:
        description: 'Run the live acceptance suite against the configured isolated staging app'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:oss-release
      - run: pnpm check:p0-release
      - run: pnpm check:p3-release
      - run: pnpm check:route-security
      - run: pnpm check:env-contract
      - run: pnpm check:release-archive
      - run: pnpm check:dependency-report
      - run: pnpm check:release-metadata
      - run: pnpm check:single-user-release
      - run: pnpm turbo run lint
      - run: pnpm turbo run typecheck

  postgres-rls-tests:
    name: Real PostgreSQL RLS Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kestrel-ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run real PostgreSQL RLS isolation test
        env:
          RUN_POSTGRES_RLS_TESTS: '1'
          TEST_POSTGRES_ADMIN_URL: postgres://postgres:kestrel-ci-password@127.0.0.1:5432/postgres
        run: pnpm --filter @kestrel/db test -- --run test/postgres-rls-isolation.test.ts

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test -- --coverage

  e2e-tests:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
        working-directory: ./apps/web
      - run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        working-directory: ./apps/web
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-blob-shard-${{ matrix.shardIndex }}
          path: apps/web/blob-report/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-shard-${{ matrix.shardIndex }}
          path: apps/web/test-results/junit.xml
          retention-days: 30
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-shard-${{ matrix.shardIndex }}
          path: |
            apps/web/test-results/output/
            apps/web/test-results/.last-run.json
          retention-days: 7

  merge-e2e-reports:
    name: Merge Playwright Reports
    if: always()
    needs: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download shard blobs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: playwright-blob-shard-*
          path: apps/web/blob-reports
          merge-multiple: true
      - name: Merge HTML report
        working-directory: ./apps/web
        run: pnpm exec playwright merge-reports --reporter=html blob-reports
        continue-on-error: true
      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-merged
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

  nightly-eval:
    name: AI Eval Harness (offline contract)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This deterministic gate always runs in CI and does not require model
      # credentials. It validates the stream parser, assertion engine, strict
      # Full-mode terminal contract, and the vendor-neutral quality gate for
      # transport, grounding, safety, latency, and cost regressions.
      - run: pnpm --filter @kestrel/ai test -- --run test/eval-offline.test.ts test/eval-quality-gate.test.ts test/eval-regression-catalog.test.ts

  live-eval:
    name: AI Eval Harness (isolated staging)
    if: (github.event_name == 'schedule' && vars.EVAL_BASE_URL != '') || (github.event_name == 'workflow_dispatch' && inputs.runLiveEval == true)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
      EVAL_COOKIE: ${{ secrets.EVAL_COOKIE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate isolated staging credentials
        run: |
          test -n "$EVAL_BASE_URL" || { echo 'EVAL_BASE_URL is required'; exit 1; }
          test -n "$EVAL_COOKIE" || { echo 'EVAL_COOKIE is required'; exit 1; }
          case "$EVAL_BASE_URL" in
            http://localhost:*|http://127.0.0.1:*)
              echo 'EVAL_BASE_URL must point to an isolated staging app, not localhost.'
              exit 1
              ;;
          esac
      - name: Run live acceptance cases
        run: pnpm --filter @kestrel/ai eval -- --base-url "$EVAL_BASE_URL" --cookie "$EVAL_COOKIE" --cases --out artifacts/eval
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-ai-eval-report
          path: artifacts/eval/
          retention-days: 30

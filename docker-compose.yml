# Kestrel — one-command Docker deployment
#
# Quick start:
#   ./docker/init-secrets.sh   # generates .env with random secrets
#   docker compose up -d
#   # Open http://localhost:3000
#
# The Postgres container includes pgvector for full feature support.
# All data persists in Docker volumes across restarts. The backup service
# writes compressed logical dumps to the local `backup-data` volume.
# Local backups protect against accidental database corruption, not host loss;
# copy the volume/archive off-host for disaster recovery.
# The base stack intentionally contains only db, app, worker, and backup.
# Optional local Langfuse observability lives in
# docker-compose.observability.yml; load it with:
#   docker compose -f docker-compose.yml \
#     -f docker-compose.observability.yml --profile observability up -d
#
# For production overrides (custom domain, TLS, resource limits),
# create a docker-compose.override.yml — Docker Compose auto-loads it.
# Set POSTGRES_PUBLISHED_PORT=127.0.0.1:5433 when host port 5432 is
# occupied, or APP_PUBLISHED_PORT=127.0.0.1:3001 when host port 3000 is.
# The setup wizard does this automatically.

services:
  db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      # Keep the logical database role names stable for existing Docker volumes.
      # Container, path, and service identifiers use Kestrel; operators can
      # migrate these database names separately when rotating a volume.
      POSTGRES_DB: hamafx
      POSTGRES_USER: hamafx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run docker/init-secrets.sh to generate .env}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run docker/init-secrets.sh to generate .env}
    ports:
      - '${POSTGRES_PUBLISHED_PORT:-127.0.0.1:5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-admin-role.sh:/docker-entrypoint-initdb.d/init-admin-role.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hamafx -d hamafx']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Docker's default json-file logger is bounded to prevent disk exhaustion.
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'


  backup:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    # Initialize the fresh named volume as root, then drop to postgres in the
    # repository-owned entrypoint. The backup and restore commands themselves
    # never run with root privileges.
    environment:
      # Keep the backup worker on the internal Compose network; it has no
      # published port and cannot be reached from the host network.
      PGHOST: db
      PGPORT: '5432'
      PGUSER: hamafx
      PGDATABASE: hamafx
      POSTGRES_USER: hamafx
      POSTGRES_DB: hamafx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run docker/init-secrets.sh to generate .env}
      BACKUP_DIR: /var/lib/postgresql/backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-172800}
    # Remove the Postgres image entrypoint: this service is a pg_dump worker,
    # and `docker compose run` must not execute database initialization logic.
    entrypoint: ['/usr/local/bin/backup-entrypoint.sh']
    volumes:
      - backup-data:/var/lib/postgresql/backups
      - ./docker/backup-entrypoint.sh:/usr/local/bin/backup-entrypoint.sh:ro
      - ./docker/backup-db.sh:/usr/local/bin/backup-db.sh:ro
      - ./docker/backup-healthcheck.sh:/usr/local/bin/backup-healthcheck.sh:ro
    command: ['/bin/sh', '/usr/local/bin/backup-db.sh']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', '/bin/sh /usr/local/bin/backup-healthcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
        reservations:
          memory: 32m
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # APP_PUBLISHED_PORT lets operators (or the setup wizard) remap the
      # host port when 3000 is already taken. Binds localhost only.
      - '127.0.0.1:${APP_PUBLISHED_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://hamafx:${POSTGRES_PASSWORD}@db:5432/hamafx
      ADMIN_DATABASE_URL: postgres://hamafx_admin:${POSTGRES_ADMIN_PASSWORD}@db:5432/hamafx
      KESTREL_LOCAL_DOCKER: 'true'
      # The bundled Postgres service is plain TCP. This explicit local-only
      # flag prevents the production DB client from attempting TLS against it.
      DB_DISABLE_SSL: 'true'
      NODE_ENV: production
      # Deployment environment: multi-user + RLS required
      MULTI_USER_ENABLED: '1'
      REGISTRATION_MODE: open
      KESTREL_ENABLE_RLS: '1'
      # PERF-06: Tune the postgres-js connection pool. 5 connections per web
      # instance covers concurrent tool calls + budget + telemetry without
      # exhausting Supabase's transaction pooler ceiling.
      DB_POOL_MAX: '5'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # INFRA-01: Health check so Docker/Compose knows when the app is ready.
    # Polls the minimal unauthenticated probe. The richer /api/health route
    # requires a session and is intentionally not suitable for Docker.
    # 3 retries × 10s = 30s grace period for Next.js cold start.
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/health/public || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # INFRA-02: Reasonable resource limits. Adjust for your hardware.
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
        reservations:
          memory: 256m
    restart: unless-stopped
    # Docker's default json-file logger is bounded to prevent disk exhaustion.
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://hamafx:${POSTGRES_PASSWORD}@db:5432/hamafx
      ADMIN_DATABASE_URL: postgres://hamafx_admin:${POSTGRES_ADMIN_PASSWORD}@db:5432/hamafx
      NODE_ENV: production
      # Deployment environment: multi-user + RLS required
      MULTI_USER_ENABLED: '1'
      REGISTRATION_MODE: open
      KESTREL_ENABLE_RLS: '1'
      WORKER_MODE: docker
      KESTREL_LOCAL_DOCKER: 'true'
      # The bundled Postgres service is plain TCP; production deployments
      # outside this Compose profile must not set this flag.
      DB_DISABLE_SSL: 'true'
      # PERF-06: Worker pool — 3 is sufficient for tick-flush + cron inserts.
      KESTREL_RUNTIME: worker
      WORKER_DB_POOL_MAX: '3'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # INFRA-01: Worker exposes a lightweight HTTP health server on port 8081.
    # Health port is intentionally not published by default; use a private
    # override only when an operator needs host/orchestrator access.
    # See apps/worker/src/index.ts — it responds { status: 'ok' } at /.
    healthcheck:
      # Production health endpoints require the token; keep the token out of
      # the command line and let Compose expand it inside the container.
      test:
        [
          'CMD-SHELL',
          'curl -fsS -H "Authorization: Bearer $${WORKER_HEALTH_TOKEN}" http://localhost:8081/health/live || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # INFRA-02: Worker is lighter; 512MB cap covers SignalR + candle aggregation.
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 128m
    restart: unless-stopped
    # Docker's default json-file logger is bounded to prevent disk exhaustion.
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

# Keep the historical volume names by default so moving an existing VM from
# /opt/hamafx to /opt/kestrel cannot silently create empty replacement volumes.
# These are compatibility identifiers, not user-facing branding. Existing
# local installs with a different Compose project name can set these overrides
# in .env before the first Kestrel start (for example, hamafx-ai_pgdata).
volumes:
  pgdata:
    name: ${POSTGRES_VOLUME_NAME:-hamafx_pgdata}
  backup-data:
    name: ${BACKUP_VOLUME_NAME:-hamafx_backup-data}

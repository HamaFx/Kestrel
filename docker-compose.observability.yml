# Kestrel optional local observability overlay
#
# This file is intentionally not loaded by `docker compose up -d`. Combine it
# with the base file only when you want the bundled Langfuse trace viewer:
#   docker compose -f docker-compose.yml \
#     -f docker-compose.observability.yml --profile observability up -d
#
# Langfuse v3 requires ClickHouse, Redis, MinIO (S3), Postgres, and its
# ingestion worker. The viewer is published only on localhost:3001 and MinIO's
# S3 API on localhost:9090. Generate overlay secrets with:
#   ./docker/init-secrets.sh --with-observability
# or: pnpm setup --with-observability

services:
  clickhouse:
    # Langfuse v3 stores traces/observations/scores in ClickHouse (>= 24.3).
    # No host ports: the Langfuse containers reach it on the internal network.
    image: clickhouse/clickhouse-server:25.8.33.6@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    container_name: kestrel-clickhouse
    restart: unless-stopped
    profiles: ['observability']
    # Run as the image's clickhouse user (101:101), like the official compose.
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
        reservations:
          memory: 256m
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    # Redis backs Langfuse's ingestion queue and cache (v3 requirement).
    image: redis:7.4.2@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
    container_name: kestrel-redis
    restart: unless-stopped
    profiles: ['observability']
    environment:
      # Exposed to the container so `$${...}` below expands at runtime.
      LANGFUSE_REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:-}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --requirepass "$${LANGFUSE_REDIS_PASSWORD}" --maxmemory-policy noeviction',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$${LANGFUSE_REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 32m
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  minio:
    # S3-compatible object storage for Langfuse v3 event/media blobs.
    # Only the S3 API is published (loopback) so the Langfuse UI can render
    # media URLs from the browser; the console stays on the internal network.
    image: cgr.dev/chainguard/minio@sha256:f70acff86192ea5d692a00157918c01874c074a0c6a4fd27826b122fb6e5689c
    container_name: kestrel-minio
    restart: unless-stopped
    profiles: ['observability']
    entrypoint: ['sh', '-c']
    # Create the `langfuse` bucket before starting the server.
    command:
      ['mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data']
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
    ports:
      - '127.0.0.1:9090:9000'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 64m
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  langfuse:
    image: langfuse/langfuse:3@sha256:a921990b3cf6f62e9452eaf8ab9bea045852375a6883abd1fdbe63afa08defa0
    container_name: kestrel-langfuse
    restart: unless-stopped
    profiles: ['observability']
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      # Docker injects HOSTNAME=<container-id>, which Next.js binds instead
      # of all interfaces — pin it so the healthcheck and port publishing work.
      HOSTNAME: 0.0.0.0
      # Postgres — reuses the same database server, separate database
      DATABASE_URL: postgresql://hamafx:${POSTGRES_PASSWORD}@db:5432/langfuse
      # Auth secrets — generated by docker/init-secrets.sh
      NEXTAUTH_URL: http://localhost:3001
      # Run ./docker/init-secrets.sh --with-observability before starting the
      # overlay. It generates dedicated non-empty values for these secrets;
      # never reuse database credentials.
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      # Telemetry (opt-out of Langfuse's own anonymous usage stats)
      TELEMETRY_ENABLED: 'false'
      # Enable experimental features: LLM-as-Judge evals, datasets
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'true'
      # ClickHouse — v3 requirement
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      # Redis — v3 requirement (ingestion queue + cache)
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-}
      # S3 object storage — v3 requirement (event/media blobs)
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
      # Browser-visible media URLs go through the loopback-published S3 API.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # The image ships wget but not curl. Use 127.0.0.1: wget resolves
      # `localhost` to IPv6 ::1, which the Node server does not bind.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/public/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      # Langfuse's first boot applies the ClickHouse schema and needs more
      # headroom than the app containers; the official compose runs it with
      # no limit at all.
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
        reservations:
          memory: 512m
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  langfuse-worker:
    # Drains the Redis ingestion queue and writes events into ClickHouse/S3.
    # Without it, accepted traces never appear in the Langfuse UI.
    image: langfuse/langfuse-worker:3@sha256:7d0f28214bd2d1bb03056439f810442b147f0143c7ebf9bdf0f39dc4e47df6cd
    container_name: kestrel-langfuse-worker
    restart: unless-stopped
    profiles: ['observability']
    environment:
      # Docker injects HOSTNAME=<container-id>, which the worker would bind
      # to instead of all interfaces — pin it so the healthcheck (and any
      # host port publishing) can reach it on localhost.
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://hamafx:${POSTGRES_PASSWORD}@db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: 'false'
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'true'
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # The worker serves a lightweight HTTP liveness server on port 3030.
      # Use 127.0.0.1 (not localhost): wget would resolve to IPv6 ::1.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3030/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 128m
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Creates the Langfuse database on an existing Postgres volume. The Postgres
  # image's /docker-entrypoint-initdb.d scripts only run when a volume is first
  # initialized, so an explicit one-shot job is required when observability is
  # enabled after the base stack has already started.
  langfuse-db-init:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: "no"
    profiles: ["observability"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run docker/init-secrets.sh to generate .env}
    command:
      - /bin/sh
      - -ec
      - |
        until pg_isready -h db -p 5432 -U hamafx -d hamafx; do sleep 1; done
        if ! psql -h db -U hamafx -d hamafx -tAc "SELECT 1 FROM pg_database WHERE datname = 'langfuse'" | grep -qx 1; then
          psql -h db -U hamafx -d hamafx -v ON_ERROR_STOP=1 -c "CREATE DATABASE langfuse"
        fi
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Observability profile data (Langfuse v3). Named by the compose project;
  # no legacy compatibility names are needed since these are brand new.
  clickhouse-data: {}
  clickhouse-logs: {}
  redis-data: {}
  minio-data: {}

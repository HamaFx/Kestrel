<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #8b949e; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #e6edf3; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #7d8590; }
    .code-pill { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #38bdf8; }
  </style>

  <!-- Background -->
  <rect width="900" height="380" rx="14" fill="#090d13" />

  <!-- CARD 1: SIMPLE MODE (PGLITE) -->
  <g transform="translate(30, 30)">
    <rect width="260" height="320" rx="12" fill="url(#cardBg1)" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Header Top Line -->
    <rect x="0" y="0" width="260" height="4" rx="2" fill="url(#accentGreen)" />
    
    <!-- Title & Badge -->
    <text x="20" y="34" class="title">🟢 SIMPLE MODE</text>
    <rect x="180" y="20" width="60" height="18" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="210" y="33" text-anchor="middle" class="badge-text" fill="#34d399">PGlite</text>
    
    <text x="20" y="52" class="subtitle">Zero-config for local dev &amp; vibecoding</text>
    <line x1="20" y1="65" x2="240" y2="65" stroke="#21262d" stroke-width="1" />

    <!-- Details block 1 -->
    <rect x="20" y="80" width="220" height="44" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="32" y="98" class="item-title">💻 Web App Layer</text>
    <text x="32" y="114" class="item-desc">Next.js 16 • React 19 • Auth.js</text>

    <!-- Details block 2 -->
    <rect x="20" y="134" width="220" height="44" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="32" y="152" class="item-title">💾 Embedded Database</text>
    <text x="32" y="168" class="item-desc">WASM PGlite in .kestrel/ (No Postgres)</text>

    <!-- Details block 3 -->
    <rect x="20" y="188" width="220" height="44" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="32" y="206" class="item-title">⚙️ Background Engine</text>
    <text x="32" y="222" class="item-desc">In-process on-demand data polling</text>

    <!-- Quick Run Box -->
    <rect x="20" y="248" width="220" height="50" rx="8" fill="#0d1117" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3" />
    <text x="32" y="268" class="subtitle">Quickstart Command:</text>
    <text x="32" y="286" class="code-pill" fill="#10b981">$ pnpm dev:local</text>
  </g>

  <!-- CARD 2: DOCKER STACK -->
  <g transform="translate(320, 30)">
    <rect width="260" height="320" rx="12" fill="url(#cardBg1)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Header Top Line -->
    <rect x="0" y="0" width="260" height="4" rx="2" fill="url(#accentBlue)" />
    
    <!-- Title & Badge -->
    <text x="20" y="34" class="title">🐳 DOCKER STACK</text>
    <rect x="165" y="20" width="75" height="18" rx="9" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
    <text x="202" y="33" text-anchor="middle" class="badge-text" fill="#38bdf8">Full Stack</text>
    
    <text x="20" y="52" class="subtitle">Production single-user self-hosting</text>
    <line x1="20" y1="65" x2="240" y2="65" stroke="#21262d" stroke-width="1" />

    <!-- Details block 1 -->
    <rect x="20" y="80" width="220" height="44" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="32" y="98" class="item-title">📦 Web Container</text>
    <text x="32" y="114" class="item-desc">Next.js 16 PWA on Node 22</text>

    <!-- Details block 2 -->
    <rect x="20" y="134" width="220" height="44" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="32" y="152" class="item-title">🐘 PostgreSQL 16 + pgvector</text>
    <text x="32" y="168" class="item-desc">Dedicated DB with semantic embeddings</text>

    <!-- Details block 3 -->
    <rect x="20" y="188" width="220" height="44" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="32" y="206" class="item-title">⚡ 24/7 Tick Worker &amp; Backup</text>
    <text x="32" y="222" class="item-desc">SignalR + Binance WS + Auto-Dumps</text>

    <!-- Quick Run Box -->
    <rect x="20" y="248" width="220" height="50" rx="8" fill="#0d1117" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <text x="32" y="268" class="subtitle">Quickstart Command:</text>
    <text x="32" y="286" class="code-pill">$ docker compose up -d</text>
  </g>

  <!-- CARD 3: EXTERNAL POSTGRES -->
  <g transform="translate(610, 30)">
    <rect width="260" height="320" rx="12" fill="url(#cardBg1)" stroke="#30363d" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Header Top Line -->
    <rect x="0" y="0" width="260" height="4" rx="2" fill="url(#accentPurple)" />
    
    <!-- Title & Badge -->
    <text x="20" y="34" class="title">⚙️ EXTERNAL DB</text>
    <rect x="175" y="20" width="65" height="18" rx="9" fill="#4c1d95" stroke="#a855f7" stroke-width="1" />
    <text x="207" y="33" text-anchor="middle" class="badge-text" fill="#c084fc">Managed</text>
    
    <text x="20" y="52" class="subtitle">Operator-managed cloud VPS or host</text>
    <line x1="20" y1="65" x2="240" y2="65" stroke="#21262d" stroke-width="1" />

    <!-- Details block 1 -->
    <rect x="20" y="80" width="220" height="44" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="32" y="98" class="item-title">☁️ VPS / Cloud Host</text>
    <text x="32" y="114" class="item-desc">Railway, Fly.io, Hetzner, AWS, etc.</text>

    <!-- Details block 2 -->
    <rect x="20" y="134" width="220" height="44" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="32" y="152" class="item-title">🗄️ External PostgreSQL</text>
    <text x="32" y="168" class="item-desc">Custom database URL + TLS</text>

    <!-- Details block 3 -->
    <rect x="20" y="188" width="220" height="44" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="32" y="206" class="item-title">🛡️ Operator Governance</text>
    <text x="32" y="222" class="item-desc">Custom backups, scaling &amp; watchdog</text>

    <!-- Quick Run Box -->
    <rect x="20" y="248" width="220" height="50" rx="8" fill="#0d1117" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,3" />
    <text x="32" y="268" class="subtitle">Environment Configuration:</text>
    <text x="32" y="286" class="code-pill" fill="#c084fc">DATABASE_URL=postgres://...</text>
  </g>
</svg>

name: Release

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js 22.13.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release contracts
        run: |
          pnpm check:oss-release
          pnpm check:p0-release
          pnpm check:p3-release
          pnpm check:env-contract
          pnpm check:route-security
          pnpm check:release-archive
          pnpm check:dependency-report
          pnpm check:single-user-release

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e11e3a6c4d7f2bfa4e0fb8f7d35a4f1c7d37e1b1 # v0.20.0

      - name: Validate release metadata
        run: pnpm check:release-metadata

      - name: Generate SBOM
        run: pnpm generate:sbom

      - name: Generate dependency license inventory
        run: pnpm licenses:generate

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-sbom
          path: artifacts/sbom/source.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload dependency license inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-licenses
          path: |
            docs/DEPENDENCY_LICENSES.md
            artifacts/licenses/dependency-licenses.json
          if-no-files-found: error
          retention-days: 90

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@e87c8ed249971350e47fab7515075f44eb134e5b # v1.7.0
        with:
          publish: pnpm run publish-packages
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141516" />
      <stop offset="100%" stop-color="#0d0e10" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d1e20" />
      <stop offset="100%" stop-color="#151618" />
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.6px; fill: #ff3616; }
    .hdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #e5e5e5; }
    .step-num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #4fa3b5; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #e5e5e5; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #9a9b9e; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #e5e5e5; }
  </style>

  <rect width="1000" height="500" rx="16" fill="url(#bg)" stroke="#2c2c2c" stroke-width="1.5" />
  <line x1="16" y1="1.5" x2="984" y2="1.5" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="28" y="24" class="eyebrow">CHAT INGRESS TO SSE EGRESS</text>
  <text x="28" y="44" class="hdr">AI Chat, 4-Desk Committee, Human-in-the-Loop Mutations &amp; Numeric Grounding Pipeline</text>

  <!-- STEP 1: INGRESS & GUARDS -->
  <g transform="translate(25, 64)" filter="url(#shadow)">
    <rect width="175" height="160" rx="10" fill="url(#card)" stroke="#2c2c2c" stroke-width="1.25" />
    <text x="14" y="24" class="step-num" fill="#4fa3b5">STAGE 1 · INGRESS</text>
    <text x="14" y="44" class="title">POST /api/chat</text>
    <line x1="14" y1="54" x2="161" y2="54" stroke="#262729" />
    <text x="14" y="74" class="desc">1. Auth + Tenant RLS</text>
    <text x="14" y="94" class="desc">2. Prompt Injection Guard</text>
    <text x="14" y="114" class="desc">3. Reserve Budget Cents</text>
    <text x="14" y="134" class="desc">4. Seed Trader Memory</text>
    <text x="14" y="150" class="code" fill="#4fa3b5">withUserTenant(userId)</text>
  </g>

  <path d="M 200 144 L 228 144" stroke="#ff3616" stroke-width="2" />
  <polygon points="228,140 236,144 228,148" fill="#ff3616" />

  <!-- STEP 2: UNIFIED ROUTER -->
  <g transform="translate(238, 64)" filter="url(#shadow)">
    <rect width="180" height="160" rx="10" fill="url(#card)" stroke="#441c14" stroke-width="1.5" />
    <text x="14" y="24" class="step-num" fill="#ff3616">STAGE 2 · ROUTER</text>
    <text x="14" y="44" class="title">routeUnified()</text>
    <line x1="14" y1="54" x2="166" y2="54" stroke="#262729" />
    <text x="14" y="74" class="code" fill="#4fa3b5">• canonical-chat</text>
    <text x="14" y="94" class="code" fill="#3f9e3d">• symbol-research</text>
    <text x="14" y="114" class="code" fill="#d98f00">• multi-symbol-research</text>
    <text x="14" y="134" class="code" fill="#ff632a">• mutation-draft</text>
    <text x="14" y="150" class="desc">Immutable ExecutionPlan</text>
  </g>

  <!-- BRANCH ARROWS -->
  <path d="M 418 104 L 455 104" stroke="#4fa3b5" stroke-width="1.5" />
  <polygon points="455,100 463,104 455,108" fill="#4fa3b5" />

  <path d="M 418 184 L 455 184" stroke="#3f9e3d" stroke-width="1.5" />
  <polygon points="455,180 463,184 455,188" fill="#3f9e3d" />

  <path d="M 328 224 L 328 364 L 455 364" fill="none" stroke="#ff3616" stroke-width="1.5" />
  <polygon points="455,360 463,364 455,368" fill="#ff3616" />

  <!-- BRANCH A: CANONICAL CHAT -->
  <g transform="translate(465, 59)" filter="url(#shadow)">
    <rect width="255" height="90" rx="10" fill="url(#card)" stroke="#2c2c2c" stroke-width="1.25" />
    <text x="14" y="22" class="step-num" fill="#4fa3b5">ROUTE A · INTERACTIVE STREAM</text>
    <text x="14" y="40" class="title">Canonical Agent + Tool Belt</text>
    <text x="14" y="58" class="desc">25+ Read Tools + Installed Plugin Tools</text>
    <text x="14" y="74" class="code" fill="#4fa3b5">Hybrid RAG (pgvector HNSW + FTS)</text>
  </g>

  <!-- BRANCH B: 4-DESK COMMITTEE -->
  <g transform="translate(465, 164)" filter="url(#shadow)">
    <rect width="255" height="145" rx="10" fill="url(#card)" stroke="#2c2c2c" stroke-width="1.25" />
    <text x="14" y="22" class="step-num" fill="#3f9e3d">ROUTE B · RESEARCH WORKFLOW</text>
    <text x="14" y="40" class="title">4-Desk Specialist Committee</text>
    <text x="14" y="58" class="desc">Step 1: Collect 30s SymbolResearchPacket</text>
    <text x="14" y="76" class="desc">Step 2: Parallel Desks (Tech/Fund/Risk/Sent)</text>
    <text x="14" y="94" class="desc">Step 3: Strict 4-of-4 Opinion Verifier Gate</text>
    <text x="14" y="112" class="desc">Step 4: Conflict-Aware Fusion Synthesis</text>
    <text x="14" y="132" class="code" fill="#3f9e3d">Single (1 desk) or Full (4 desks)</text>
  </g>

  <!-- BRANCH C: MUTATION CONFIRMATION -->
  <g transform="translate(465, 324)" filter="url(#shadow)">
    <rect width="255" height="95" rx="10" fill="url(#card)" stroke="#441c14" stroke-width="1.5" />
    <text x="14" y="22" class="step-num" fill="#ff3616">ROUTE C · HUMAN-IN-THE-LOOP</text>
    <text x="14" y="40" class="title">Aegis Confirm Gate &amp; Sanity</text>
    <text x="14" y="58" class="desc">10x/50x ATR Band Check + HMAC Token</text>
    <text x="14" y="76" class="code" fill="#ff632a">set_alert • log_journal • plugin write</text>
  </g>

  <!-- ARROWS TO VERIFICATION & EGRESS -->
  <path d="M 720 104 L 755 154" stroke="#4fa3b5" stroke-width="1.5" />
  <path d="M 720 234 L 755 194" stroke="#3f9e3d" stroke-width="1.5" />
  <polygon points="752,190 760,192 754,198" fill="#3f9e3d" />

  <!-- STAGE 4: GROUNDING & FINALIZATION -->
  <g transform="translate(760, 64)" filter="url(#shadow)">
    <rect width="215" height="355" rx="10" fill="url(#card)" stroke="#2c2c2c" stroke-width="1.25" />
    <text x="14" y="24" class="step-num" fill="#d98f00">STAGE 4 · VERIFY &amp; EGRESS</text>
    <text x="14" y="44" class="title">Grounding &amp; Ledger</text>
    <line x1="14" y1="54" x2="201" y2="54" stroke="#262729" />
    <text x="14" y="78" class="title" fill="#3f9e3d">1. Numeric Grounding</text>
    <text x="14" y="96" class="desc">Every market price must match</text>
    <text x="14" y="112" class="desc">fresh tool/packet data (±0.5)</text>
    <text x="14" y="140" class="title" fill="#4fa3b5">2. Staleness Disclosure</text>
    <text x="14" y="158" class="desc">Enforces explicit disclosure</text>
    <text x="14" y="174" class="desc">when quote age &gt; 60 seconds</text>
    <text x="14" y="202" class="title" fill="#ff632a">3. Self-Correction Retry</text>
    <text x="14" y="220" class="desc">1 repair pass if ungrounded</text>
    <text x="14" y="236" class="desc">numbers are detected</text>
    <text x="14" y="264" class="title" fill="#d98f00">4. Reconcile Budget Cents</text>
    <text x="14" y="282" class="desc">SELECT ... FOR UPDATE on</text>
    <text x="14" y="298" class="desc">daily_ai_spend + audit trace</text>
    <rect x="14" y="316" width="187" height="24" rx="6" fill="#0d0e10" stroke="#3f9e3d" />
    <text x="107" y="332" text-anchor="middle" class="code" fill="#3f9e3d">SSE UIMessageChunk Stream</text>
  </g>
</svg>

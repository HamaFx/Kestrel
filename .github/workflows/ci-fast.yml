name: ci-fast

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Next's built-in typecheck is redundant here: this job runs
      # `turbo run typecheck` (tsrs) on the same commit. Setting the flag
      # job-wide also keeps Turbo task hashes identical between the
      # typecheck and build steps, so package builds are restored from
      # cache instead of re-executed.
      NEXT_BUILD_SKIP_TYPECHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Turborepo and Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
            ${{ runner.os }}-turbo-
      - run: pnpm check:route-security
      - run: pnpm check:env-contract
      - run: pnpm check:compose-images
      # Audit 2026-10-18 — the docs/architecture.md mastra-v2 tree must match
      # packages/ai/src/mastra-v2/ (docs-drift guard).
      - run: pnpm check:architecture-tree
      - run: pnpm check:maintainability
      - run: pnpm turbo run lint
      - run: pnpm turbo run typecheck
      # Audit v2 §4.2 — knip is blocking: the workspace is at zero unused
      # exports/deps; new dead code must fail CI instead of accumulating.
      - name: Knip
        run: pnpm knip --no-progress
      # Audit dependencies for critical security vulnerabilities.
      - run: pnpm audit --audit-level=critical
      # Build all packages and applications.
      - run: pnpm turbo run build
      # Enforce JS chunk size budgets.
      - name: Bundle Size Guard
        run: pnpm --filter @kestrel/web bundle-size:check

  unit-tests:
    name: Unit Tests (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hamafx
          POSTGRES_USER: hamafx
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hamafx -d hamafx" --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Turborepo cache (test results)
        uses: actions/cache@v4
        with:
          # The unit-tests job never runs Next, so it only needs .turbo; the
          # build job above owns apps/web/.next/cache (identical immutable
          # cache keys across jobs made one of them a write-only no-op).
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-
            ${{ runner.os }}-turbo-
      - run: pnpm turbo run test -- --coverage
        env:
          # The unit-tests job provisions the pgvector service container, so
          # the Postgres-gated suites (RLS isolation, query-layer integration,
          # full-analysis queue) run here — they are part of the coverage
          # thresholds.
          RUN_POSTGRES_RLS_TESTS: '1'
          TEST_POSTGRES_ADMIN_URL: postgres://hamafx:test@localhost:5432/hamafx
          RUN_AI_QUEUE_POSTGRES_TESTS: '1'
      - name: Test File Guard
        run: pnpm test:empty-guard
      # The report action hard-requires coverage/coverage-summary.json at the
      # repo root; derive it from the per-workspace istanbul output.
      - name: Merge coverage summaries
        run: node scripts/merge-coverage-summary.mjs
      - name: Report Coverage
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        with:
          vite-config-path: vitest.config.ts
          file-coverage-mode: none

  # Audit 2026-10-18 §9 — CI matrix entry for the Postgres-backed Mastra
  # storage path. The default unit-tests job exercises libsql; this job runs
  # the full @kestrel/ai suite with MASTRA_STORAGE=postgres and the
  # Postgres-gated integration suites enabled, so libsql-only drift is caught.
  unit-tests-postgres-storage:
    name: Unit Tests (MASTRA_STORAGE=postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hamafx
          POSTGRES_USER: hamafx
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hamafx -d hamafx" --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: AI suite on Postgres-backed Mastra storage
        run: pnpm --filter @kestrel/ai test
        env:
          MASTRA_STORAGE: postgres
          DATABASE_URL: postgres://hamafx:test@localhost:5432/hamafx
          DIRECT_URL: postgres://hamafx:test@localhost:5432/hamafx
          DB_DISABLE_SSL: 'true'
          KESTREL_LOCAL_DOCKER: 'true'
          RUN_AI_QUEUE_POSTGRES_TESTS: '1'
          TEST_POSTGRES_ADMIN_URL: postgres://hamafx:test@localhost:5432/hamafx

  required-status:
    name: Required CI Status
    if: always()
    needs: [lint-and-typecheck, unit-tests, unit-tests-postgres-storage]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required job failed or was cancelled
        env:
          LINT_RESULT: ${{ needs.lint-and-typecheck.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          PG_UNIT_RESULT: ${{ needs.unit-tests-postgres-storage.result }}
        run: |
          test "$LINT_RESULT" = success || { echo "lint-and-typecheck: $LINT_RESULT"; exit 1; }
          test "$UNIT_RESULT" = success || { echo "unit-tests: $UNIT_RESULT"; exit 1; }
          test "$PG_UNIT_RESULT" = success || { echo "unit-tests-postgres-storage: $PG_UNIT_RESULT"; exit 1; }
          echo "Required CI jobs passed."

name: Docker Publish

on:
  release:
    types: [published]

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
      # INFRA-04: Trivy needs security-events write to upload SARIF.
      security-events: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract Docker metadata for web
        id: meta-web
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=${{ github.event.release.tag_name }}

      - name: Extract Docker metadata for worker
        id: meta-worker
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5
        with:
          images: ghcr.io/${{ github.repository }}/worker
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=${{ github.event.release.tag_name }}

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # P2: Set up Buildx so cache-from/cache-to type=gha is supported.
      # This lets the scan build cache the push build, avoiding a double build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web image (for scan)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: kestrel-web:scan
          # P2: Cache to GHA so the push step reuses these layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image (for scan)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          load: true
          tags: kestrel-worker:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # INFRA-04: Vulnerability scan — fail on CRITICAL severity.
      - name: Scan Web image with Trivy
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: kestrel-web:scan
          format: 'sarif'
          output: 'trivy-web.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan Worker image with Trivy
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: kestrel-worker:scan
          format: 'sarif'
          output: 'trivy-worker.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Web Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: 'trivy-web.sarif'
          category: trivy-web

      - name: Upload Worker Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: 'trivy-worker.sarif'
          category: trivy-worker

      - name: Push Web image
        id: push-web
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            DEPLOYED_SHA=${{ github.sha }}
          labels: ${{ steps.meta-web.outputs.labels }}
          tags: ${{ steps.meta-web.outputs.tags }}
          # P2: Reuse the scan build's GHA cache instead of building from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Worker image
        id: push-worker
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            DEPLOYED_SHA=${{ github.sha }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          tags: ${{ steps.meta-worker.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  <g transform="translate(545, 272)" filter="url(#sh2)">
    <rect width="215" height="204" rx="12" fill="url(#card2)" stroke="#2c2c2c" stroke-width="1.25" />
    <rect x="0" y="0" width="215" height="3" rx="1.5" fill="url(#warnBar2)" />

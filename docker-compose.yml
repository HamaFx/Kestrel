# Kestrel — one-command Docker deployment
#
# Quick start:
#   ./docker/init-secrets.sh   # generates .env with random secrets
#   docker compose up -d
#   # Open http://localhost:3000
#
# The Postgres container includes pgvector for full feature support.
# All data persists in Docker volumes across restarts. The backup service
# writes compressed logical dumps to the local `backup-data` volume.
# Local backups protect against accidental database corruption, not host loss;
# copy the volume/archive off-host for disaster recovery.
# Langfuse is opt-in: use `docker compose --profile observability up -d`.
# The observability profile adds ClickHouse, Redis, MinIO (S3), and a
# Langfuse worker — Langfuse v3 requires all of them alongside Postgres —
# and publishes the trace viewer at http://localhost:3001. The default
# stack keeps external observability disabled and binds services to
# localhost only.
#
# For production overrides (custom domain, TLS, resource limits),
# create a docker-compose.override.yml — Docker Compose auto-loads it.
# Set POSTGRES_PUBLISHED_PORT=127.0.0.1:5433 when host port 5432 is
# occupied, or APP_PUBLISHED_PORT=127.0.0.1:3001 when host port 3000 is.
# The setup wizard does this automatically.

services:
  db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      # Keep the logical database role names stable for existing Docker volumes.
      # Container, path, and service identifiers use Kestrel; operators can
      # migrate these database names separately when rotating a volume.
      POSTGRES_DB: hamafx
      POSTGRES_USER: hamafx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run docker/init-secrets.sh to generate .env}
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-langfuse-db.sh:/docker-entrypoint-initdb.d/init-langfuse-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamafx -d hamafx"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Docker's default json-file logger is bounded to prevent disk exhaustion.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  clickhouse:
    # Langfuse v3 stores traces/observations/scores in ClickHouse (>= 24.3).
    # No host ports: the Langfuse containers reach it on the internal network.
    image: clickhouse/clickhouse-server:25.8.33.6@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    container_name: kestrel-clickhouse
    restart: unless-stopped
    profiles: ["observability"]
    # Run as the image's clickhouse user (101:101), like the official compose.
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    # Redis backs Langfuse's ingestion queue and cache (v3 requirement).
    image: redis:7.4.2@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
    container_name: kestrel-redis
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      # Exposed to the container so `$${...}` below expands at runtime.
      LANGFUSE_REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:-}
    command: ["sh", "-c", "exec redis-server --requirepass \"$${LANGFUSE_REDIS_PASSWORD}\" --maxmemory-policy noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${LANGFUSE_REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 32m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    # S3-compatible object storage for Langfuse v3 event/media blobs.
    # Only the S3 API is published (loopback) so the Langfuse UI can render
    # media URLs from the browser; the console stays on the internal network.
    image: cgr.dev/chainguard/minio@sha256:f70acff86192ea5d692a00157918c01874c074a0c6a4fd27826b122fb6e5689c
    container_name: kestrel-minio
    restart: unless-stopped
    profiles: ["observability"]
    entrypoint: ["sh", "-c"]
    # Create the `langfuse` bucket before starting the server.
    command: ['mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data']
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
    ports:
      - "127.0.0.1:9090:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  langfuse:
    image: langfuse/langfuse:3@sha256:a921990b3cf6f62e9452eaf8ab9bea045852375a6883abd1fdbe63afa08defa0
    container_name: kestrel-langfuse
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Docker injects HOSTNAME=<container-id>, which Next.js binds instead
      # of all interfaces — pin it so the healthcheck and port publishing work.
      HOSTNAME: 0.0.0.0
      # Postgres — reuses the same database server, separate database
      DATABASE_URL: postgresql://hamafx:${POSTGRES_PASSWORD}@db:5432/langfuse
      # Auth secrets — generated by docker/init-secrets.sh
      NEXTAUTH_URL: http://localhost:3001
      # The optional profile is interpolated even when inactive, so these
      # default to empty rather than breaking the ordinary app startup.
      # Run docker/init-secrets.sh before enabling observability; it generates
      # dedicated non-empty values for every LANGFUSE_* key. Never reuse the DB key.
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      # Telemetry (opt-out of Langfuse's own anonymous usage stats)
      TELEMETRY_ENABLED: "false"
      # Enable experimental features: LLM-as-Judge evals, datasets
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      # ClickHouse — v3 requirement
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      # Redis — v3 requirement (ingestion queue + cache)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-}
      # S3 object storage — v3 requirement (event/media blobs)
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
      # Browser-visible media URLs go through the loopback-published S3 API.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # The image ships wget but not curl. Use 127.0.0.1: wget resolves
      # `localhost` to IPv6 ::1, which the Node server does not bind.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      # Langfuse's first boot applies the ClickHouse schema and needs more
      # headroom than the app containers; the official compose runs it with
      # no limit at all.
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
        reservations:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  langfuse-worker:
    # Drains the Redis ingestion queue and writes events into ClickHouse/S3.
    # Without it, accepted traces never appear in the Langfuse UI.
    image: langfuse/langfuse-worker:3@sha256:7d0f28214bd2d1bb03056439f810442b147f0143c7ebf9bdf0f39dc4e47df6cd
    container_name: kestrel-langfuse-worker
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      # Docker injects HOSTNAME=<container-id>, which the worker would bind
      # to instead of all interfaces — pin it so the healthcheck (and any
      # host port publishing) can reach it on localhost.
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://hamafx:${POSTGRES_PASSWORD}@db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # The worker serves a lightweight HTTP liveness server on port 3030.
      # Use 127.0.0.1 (not localhost): wget would resolve to IPv6 ::1.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3030/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    # Initialize the fresh named volume as root, then drop to postgres in the
    # repository-owned entrypoint. The backup and restore commands themselves
    # never run with root privileges.
    environment:
      # Keep the backup worker on the internal Compose network; it has no
      # published port and cannot be reached from the host network.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: hamafx
      PGDATABASE: hamafx
      POSTGRES_USER: hamafx
      POSTGRES_DB: hamafx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run docker/init-secrets.sh to generate .env}
      BACKUP_DIR: /var/lib/postgresql/backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-172800}
    # Remove the Postgres image entrypoint: this service is a pg_dump worker,
    # and `docker compose run` must not execute database initialization logic.
    entrypoint: ["/usr/local/bin/backup-entrypoint.sh"]
    volumes:
      - backup-data:/var/lib/postgresql/backups
      - ./docker/backup-entrypoint.sh:/usr/local/bin/backup-entrypoint.sh:ro
      - ./docker/backup-db.sh:/usr/local/bin/backup-db.sh:ro
      - ./docker/backup-healthcheck.sh:/usr/local/bin/backup-healthcheck.sh:ro
    command: ["/bin/sh", "/usr/local/bin/backup-db.sh"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh /usr/local/bin/backup-healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
        reservations:
          memory: 32m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # APP_PUBLISHED_PORT lets operators (or the setup wizard) remap the
      # host port when 3000 is already taken. Binds localhost only.
      - "127.0.0.1:${APP_PUBLISHED_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://hamafx:${POSTGRES_PASSWORD}@db:5432/hamafx
      KESTREL_LOCAL_DOCKER: "true"
      # The bundled Postgres service is plain TCP. This explicit local-only
      # flag prevents the production DB client from attempting TLS against it.
      DB_DISABLE_SSL: "true"
      NODE_ENV: production
      # OSS release boundary: shared multi-user/RLS mode is intentionally disabled.
      MULTI_USER_ENABLED: "0"
      REGISTRATION_MODE: owner-first
      KESTREL_ENABLE_RLS: "0"
      OSS_SINGLE_USER_MODE: "1"
      # PERF-06: Tune the postgres-js connection pool. 5 connections per web
      # instance covers concurrent tool calls + budget + telemetry without
      # exhausting Supabase's transaction pooler ceiling.
      DB_POOL_MAX: "5"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # INFRA-01: Health check so Docker/Compose knows when the app is ready.
    # Polls the minimal unauthenticated probe. The richer /api/health route
    # requires a session and is intentionally not suitable for Docker.
    # 3 retries × 10s = 30s grace period for Next.js cold start.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health/public || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # INFRA-02: Reasonable resource limits. Adjust for your hardware.
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 256m
    restart: unless-stopped
    # Docker's default json-file logger is bounded to prevent disk exhaustion.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://hamafx:${POSTGRES_PASSWORD}@db:5432/hamafx
      NODE_ENV: production
      # OSS release boundary: shared multi-user/RLS mode is intentionally disabled.
      MULTI_USER_ENABLED: "0"
      REGISTRATION_MODE: owner-first
      KESTREL_ENABLE_RLS: "0"
      OSS_SINGLE_USER_MODE: "1"
      WORKER_MODE: docker
      KESTREL_LOCAL_DOCKER: "true"
      # The bundled Postgres service is plain TCP; production deployments
      # outside this Compose profile must not set this flag.
      DB_DISABLE_SSL: "true"
      # PERF-06: Worker pool — 3 is sufficient for tick-flush + cron inserts.
      KESTREL_RUNTIME: worker
      WORKER_DB_POOL_MAX: "3"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # INFRA-01: Worker exposes a lightweight HTTP health server on port 8081.
    # Health port is intentionally not published by default; use a private
    # override only when an operator needs host/orchestrator access.
    # See apps/worker/src/index.ts — it responds { status: 'ok' } at /.
    healthcheck:
      # Production health endpoints require the token; keep the token out of
      # the command line and let Compose expand it inside the container.
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${WORKER_HEALTH_TOKEN}\" http://localhost:8081/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # INFRA-02: Worker is lighter; 512MB cap covers SignalR + candle aggregation.
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 128m
    restart: unless-stopped
    # Docker's default json-file logger is bounded to prevent disk exhaustion.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Keep the historical volume names by default so moving an existing VM from
# /opt/hamafx to /opt/kestrel cannot silently create empty replacement volumes.
# These are compatibility identifiers, not user-facing branding. Existing
# local installs with a different Compose project name can set these overrides
# in .env before the first Kestrel start (for example, hamafx-ai_pgdata).
volumes:
  pgdata:
    name: ${POSTGRES_VOLUME_NAME:-hamafx_pgdata}
  backup-data:
    name: ${BACKUP_VOLUME_NAME:-hamafx_backup-data}
  # Observability profile data (Langfuse v3). Named by the compose project;
  # no legacy compatibility names are needed since these are brand new.
  clickhouse-data: {}
  clickhouse-logs: {}
  redis-data: {}
  minio-data: {}

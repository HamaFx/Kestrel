<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="100%" height="100%">
  <defs>
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141516" />
      <stop offset="100%" stop-color="#0d0e10" />
    </linearGradient>
    <linearGradient id="panelSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d1e20" />
      <stop offset="100%" stop-color="#151618" />
    </linearGradient>
    <linearGradient id="emberBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3616" />
      <stop offset="100%" stop-color="#ff632a" />
    </linearGradient>
    <linearGradient id="infoBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fa3b5" />
      <stop offset="100%" stop-color="#6bc0d2" />
    </linearGradient>
    <linearGradient id="warnBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d98f00" />
      <stop offset="100%" stop-color="#f0ad1a" />
    </linearGradient>
    <linearGradient id="bullBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f9e3d" />
      <stop offset="100%" stop-color="#52b750" />
    </linearGradient>
    <filter id="panelShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.6px; fill: #ff3616; }
    .hdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #e5e5e5; letter-spacing: -0.2px; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #e5e5e5; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #9a9b9e; }
    .mono-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; }
    .step-badge { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; }
  </style>

  <!-- Outer Obsidian Chassis -->
  <rect width="980" height="470" rx="16" fill="url(#bgObsidian)" stroke="#2c2c2c" stroke-width="1.5" />
  <line x1="16" y1="1.5" x2="964" y2="1.5" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Top Telemetry Header Bar -->
  <text x="28" y="28" class="eyebrow">KESTREL MASTRA V2 ENGINE</text>
  <text x="28" y="48" class="hdr">Pure 4-Desk Committee, Hard 4/4 Numeric Gate &amp; Direct SSE Fusion</text>
  <rect x="786" y="20" width="166" height="24" rx="12" fill="#0d0e10" stroke="#441c14" stroke-width="1" />
  <circle cx="802" cy="32" r="4" fill="#ff3616" />
  <text x="814" y="36" class="mono-tag" fill="#e5e5e5">5 LLM Calls · ~8–15s</text>

  <!--STAGE 1: USER PROMPT & UNIFIED ROUTER -->
  <g transform="translate(24, 152)" filter="url(#panelShadow)">
    <rect width="166" height="176" rx="12" fill="url(#panelSurface)" stroke="#2c2c2c" stroke-width="1.25" />
    <rect x="0" y="0" width="166" height="3" rx="1.5" fill="url(#emberBar)" />
    <text x="14" y="24" class="step-badge" fill="#ff3616">01 · INGRESS &amp; ROUTER</text>
    <text x="14" y="44" class="node-title">Unified Prompt Router</text>
    <line x1="14" y1="54" x2="152" y2="54" stroke="#262729" />
    <text x="14" y="72" class="node-desc">• Prompt-Injection Screen</text>
    <text x="14" y="90" class="node-desc">• Atomic Budget Reserve</text>
    <text x="14" y="108" class="node-desc">• Hybrid pgvector + FTS</text>
    <rect x="12" y="122" width="142" height="42" rx="8" fill="#0d0e10" stroke="#262729" />
    <text x="22" y="139" class="mono-tag" fill="#4fa3b5">Single → 1 Fast Agent</text>
    <text x="22" y="155" class="mono-tag" fill="#ff3616">Full   → 4-Desk Phalanx</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 190 240 L 214 240" fill="none" stroke="#ff3616" stroke-width="2" />
  <polygon points="214,236 222,240 214,244" fill="#ff3616" />

  <!-- STAGE 2: DETERMINISTIC PACKET -->
  <g transform="translate(224, 152)" filter="url(#panelShadow)">
    <rect width="160" height="176" rx="12" fill="url(#panelSurface)" stroke="#2c2c2c" stroke-width="1.25" />
    <rect x="0" y="0" width="160" height="3" rx="1.5" fill="url(#infoBar)" />
    <text x="14" y="24" class="step-badge" fill="#4fa3b5">02 · DATA PACKET</text>
    <text x="14" y="44" class="node-title">Research Packet</text>
    <line x1="14" y1="54" x2="146" y2="54" stroke="#262729" />
    <text x="14" y="72" class="node-desc">• Live Price + Staleness</text>
    <text x="14" y="90" class="node-desc">• 1D / 4H / 1H / 15M Bars</text>
    <text x="14" y="108" class="node-desc">• Swings, PDH/PDL, Sessions</text>
    <text x="14" y="126" class="node-desc">• FRED Yields, CFTC, News</text>
    <rect x="12" y="140" width="136" height="24" rx="6" fill="#0d0e10" stroke="#262729" />
    <text x="80" y="156" text-anchor="middle" class="mono-tag" fill="#4fa3b5">30s SWR Frozen Snapshot</text>
  </g>

  <!-- Fan-Out Connectors 2 -> 4 Desks -->
  <path d="M 384 216 Q 406 216, 406 108 Q 406 108, 422 108" fill="none" stroke="#4fa3b5" stroke-width="1.5" />
  <polygon points="422,105 429,108 422,111" fill="#4fa3b5" />

  <path d="M 384 230 Q 410 230, 410 198 Q 410 198, 422 198" fill="none" stroke="#d98f00" stroke-width="1.5" />
  <polygon points="422,195 429,198 422,201" fill="#d98f00" />

  <path d="M 384 250 Q 410 250, 410 288 Q 410 288, 422 288" fill="none" stroke="#3f9e3d" stroke-width="1.5" />
  <polygon points="422,285 429,288 422,291" fill="#3f9e3d" />

  <path d="M 384 264 Q 406 264, 406 378 Q 406 378, 422 378" fill="none" stroke="#ff3616" stroke-width="1.5" />
  <polygon points="422,375 429,378 422,381" fill="#ff3616" />

  <!-- STAGE 3: 4 PARALLEL SPECIALIST DESKS -->
  <!-- Desk 1: Technical -->
  <g transform="translate(432, 68)" filter="url(#panelShadow)">
    <rect width="196" height="78" rx="10" fill="url(#panelSurface)" stroke="#2c2c2c" stroke-width="1.25" />
    <rect x="0" y="0" width="196" height="3" rx="1.5" fill="url(#infoBar)" />
    <text x="14" y="22" class="node-title">Technical Strategist</text>
    <text x="14" y="40" class="node-desc">EMA/RSI/ATR/MACD, Confirmed</text>
    <text x="14" y="54" class="node-desc">Swings, PDH/PDL, Session Ranges</text>
    <text x="14" y="70" class="mono-tag" fill="#4fa3b5">Multi-TF Structure</text>
  </g>

  <!-- Desk 2: Fundamental / Macro -->
  <g transform="translate(432, 158)" filter="url(#panelShadow)">
    <rect width="196" height="78" rx="10" fill="url(#panelSurface)" stroke="#2c2c2c" stroke-width="1.25" />
    <rect x="0" y="0" width="196" height="3" rx="1.5" fill="url(#warnBar)" />
    <text x="14" y="22" class="node-title">Macro &amp; Fundamental</text>
    <text x="14" y="40" class="node-desc">FRED Real Yields, DXY Resonance,</text>
    <text x="14" y="54" class="node-desc">CPI/FOMC/NFP &amp; CFTC CoT</text>
    <text x="14" y="70" class="mono-tag" fill="#d98f00">Institutional Positioning</text>
  </g>

  <!-- Desk 3: Risk Governor -->
  <g transform="translate(432, 248)" filter="url(#panelShadow)">
    <rect width="196" height="78" rx="10" fill="url(#panelSurface)" stroke="#2c2c2c" stroke-width="1.25" />
    <rect x="0" y="0" width="196" height="3" rx="1.5" fill="url(#bullBar)" />
    <text x="14" y="22" class="node-title">Risk &amp; Sizing Governor</text>
    <text x="14" y="40" class="node-desc">ATR Stop Distance, R-Multiple,</text>
    <text x="14" y="54" class="node-desc">Daily R Cap &amp; Invalidation</text>
    <text x="14" y="70" class="mono-tag" fill="#3f9e3d">Capital Preservation</text>
  </g>

  <!-- Desk 4: Sentiment -->
  <g transform="translate(432, 338)" filter="url(#panelShadow)">
    <rect width="196" height="78" rx="10" fill="url(#panelSurface)" stroke="#2c2c2c" stroke-width="1.25" />
    <rect x="0" y="0" width="196" height="3" rx="1.5" fill="url(#emberBar)" />
    <text x="14" y="22" class="node-title">News &amp; Sentiment Desk</text>
    <text x="14" y="40" class="node-desc">Marketaux Headlines, Catalyst</text>
    <text x="14" y="54" class="node-desc">Tone &amp; Narrative Skew</text>
    <text x="14" y="70" class="mono-tag" fill="#ff632a">Real-Time Catalyst Pulse</text>
  </g>

  <!-- Fan-In Connectors 4 Desks -> Hard 4/4 Gate -->
  <path d="M 628 108 Q 648 108, 648 220 Q 648 220, 662 220" fill="none" stroke="#4fa3b5" stroke-width="1.5" />
  <path d="M 628 198 Q 644 198, 644 232 Q 644 232, 662 232" fill="none" stroke="#d98f00" stroke-width="1.5" />
  <path d="M 628 288 Q 644 288, 644 248 Q 644 248, 662 248" fill="none" stroke="#3f9e3d" stroke-width="1.5" />
  <path d="M 628 378 Q 648 378, 648 260 Q 648 260, 662 260" fill="none" stroke="#ff3616" stroke-width="1.5" />
  <polygon points="662,236 670,240 662,244" fill="#ff3616" />

  <!-- STAGE 4: HARD 4/4 NUMERIC VERIFIER GATE -->
  <g transform="translate(672, 138)" filter="url(#panelShadow)">
    <rect width="136" height="204" rx="12" fill="url(#panelSurface)" stroke="#441c14" stroke-width="1.5" />
    <rect x="0" y="0" width="136" height="3" rx="1.5" fill="url(#emberBar)" />
    <text x="68" y="24" text-anchor="middle" class="step-badge" fill="#ff3616">04 · HARD GATE</text>
    <text x="68" y="44" text-anchor="middle" class="node-title">4-of-4 Verifier</text>
    <line x1="12" y1="54" x2="124" y2="54" stroke="#262729" />
    <rect x="12" y="66" width="112" height="26" rx="6" fill="#0d0e10" stroke="#262729" />
    <text x="68" y="83" text-anchor="middle" class="mono-tag" fill="#3f9e3d">±0.5 Price Match</text>
    <rect x="12" y="100" width="112" height="26" rx="6" fill="#0d0e10" stroke="#262729" />
    <text x="68" y="117" text-anchor="middle" class="mono-tag" fill="#4fa3b5">&lt;60s Fresh Check</text>
    <rect x="12" y="134" width="112" height="26" rx="6" fill="#0d0e10" stroke="#262729" />
    <text x="68" y="151" text-anchor="middle" class="mono-tag" fill="#d98f00">1x Repair Retry</text>
    <text x="68" y="182" text-anchor="middle" class="mono-tag" fill="#f03e3e">Fails Closed if &lt;4/4</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <path d="M 808 240 L 830 240" fill="none" stroke="#3f9e3d" stroke-width="2" />
  <polygon points="830,236 838,240 830,244" fill="#3f9e3d" />

  <!-- STAGE 5: FUSION SYNTHESIS & SSE EGRESS -->
  <g transform="translate(840, 138)" filter="url(#panelShadow)">
    <rect width="116" height="204" rx="12" fill="url(#panelSurface)" stroke="#2c2c2c" stroke-width="1.5" />
    <rect x="0" y="0" width="116" height="3" rx="1.5" fill="url(#bullBar)" />
    <text x="58" y="24" text-anchor="middle" class="step-badge" fill="#3f9e3d">05 · FUSION</text>
    <text x="58" y="44" text-anchor="middle" class="node-title">Arbiter SSE</text>
    <line x1="12" y1="54" x2="104" y2="54" stroke="#262729" />
    <text x="58" y="76" text-anchor="middle" class="node-desc">Weighs Desk</text>
    <text x="58" y="92" text-anchor="middle" class="node-desc">Clashes &amp; Bias</text>
    <text x="58" y="118" text-anchor="middle" class="node-desc">Scenario Table</text>
    <text x="58" y="134" text-anchor="middle" class="node-desc">&amp; Invalidation</text>
    <rect x="10" y="156" width="96" height="32" rx="6" fill="#0d0e10" stroke="#3f9e3d" stroke-width="1" />
    <text x="58" y="176" text-anchor="middle" class="mono-tag" fill="#3f9e3d">Direct Stream</text>
  </g>
</svg>

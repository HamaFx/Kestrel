name: post-deploy-smoke

# Verifies a live deployment right after it ships:
#   - deployment_status: Vercel posts GitHub deployment events for
#     production deployments; verify the deployed URL immediately.
#   - schedule: daily safety net for deployments that don't publish GitHub
#     events (self-hosted Docker) and for slow-burn regressions.
#   - workflow_dispatch: manual run after a self-hosted rollout.
#
# The checks are read-only (`scripts/verify-production.mjs` never applies
# migrations). When no production URL is configured, the job exits with a
# notice instead of failing, so forks are not broken.

permissions:
  contents: read

on:
  deployment_status:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only successful, production-environment deployments trigger a run.
    # `contains` is case-insensitive in GitHub expressions, so this matches
    # Vercel's "Production" / "production".
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment, 'production'))
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve deployment URL
        id: resolve
        run: |
          set -euo pipefail
          url="${{ vars.KESTREL_PRODUCTION_URL }}"
          if [ -z "$url" ] && [ "${{ github.event_name }}" = "deployment_status" ]; then
            url="${{ github.event.deployment_status.environment_url }}"
            if [ -z "$url" ]; then
              url="${{ github.event.deployment_status.target_url }}"
            fi
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -z "$url" ]; then
            echo "::notice::No production URL available (set the KESTREL_PRODUCTION_URL repository variable); nothing to verify."
          fi

      - name: Run production verification
        if: steps.resolve.outputs.url != ''
        env:
          PRODUCTION_URL: ${{ steps.resolve.outputs.url }}
          # Optional: only configured targets are checked (see DEPLOY.md).
          WORKER_HEALTH_URL: ${{ vars.KESTREL_WORKER_HEALTH_URL }}
          WORKER_HEALTH_TOKEN: ${{ secrets.KESTREL_WORKER_HEALTH_TOKEN }}
          VERIFY_ALERTS: ${{ secrets.KESTREL_CRON_SECRET != '' && '1' || '0' }}
          PRODUCTION_CRON_SECRET: ${{ secrets.KESTREL_CRON_SECRET }}
          VERIFY_MIGRATIONS: ${{ secrets.KESTREL_DIRECT_URL != '' && '1' || '0' }}
          DIRECT_URL: ${{ secrets.KESTREL_DIRECT_URL }}
        run: node scripts/verify-production.mjs

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Post-deploy verification"
            echo ""
            if [ -n "${{ steps.resolve.outputs.url }}" ]; then
              echo "- Target: ${{ steps.resolve.outputs.url }}"
            else
              echo "- Skipped: no production URL configured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

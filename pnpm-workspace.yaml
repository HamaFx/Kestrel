packages:
  - 'apps/*'
  - 'packages/*'
  - 'loadtest'

# Mastra CLI / @mastra/deployer bundle the config with the `typescript-paths`
# rollup plugin, which only supports TypeScript <= 6 (it calls ts.sys /
# ts.readConfigFile / ts.findConfigFile, all removed in TS 7). The workspace
# is on TS 7, so the patch below makes the plugin degrade gracefully (alias
# resolution disabled) instead of crashing when `mastra dev` is run.
# The eventsource-parser patch strips the `source` export condition that
# breaks bundlers resolving the published TypeScript sources.
patchedDependencies:
  eventsource-parser@3.1.1: patches/eventsource-parser@3.1.1.patch
  typescript-paths@1.5.2: patches/typescript-paths@1.5.2.patch

# Overrides (applied by pnpm >= 10; they were silent no-ops on the old pnpm 9
# pin, which is part of why the package manager was upgraded).
#
# OTel: force a single @opentelemetry/api copy across the workspace.
# Advisories: shell-quote, fast-uri, protobufjs, and the brace-expansion /
# nanoid lines pin the patched releases. gray-matter (via Mastra) only
# supports the js-yaml 3.x API, so it keeps a scoped 3.x exception while the
# rest of the tree can use js-yaml 4.x.
overrides:
  '@opentelemetry/api': '1.9.1'
  '@auth/core': '0.41.3'
  esbuild: '0.28.2'
  fast-copy: '4.1.0'
  fast-uri: '3.1.8'
  shell-quote: '1.12.0'
  protobufjs: '7.6.6'
  js-yaml: '4.3.2'
  'gray-matter>js-yaml': '3.15.2'
  'nanoid@3': '3.3.20'
  'brace-expansion@^1.0.0': '1.1.21'
  'brace-expansion@^5.0.0': '5.0.12'

# The repo deliberately tracks same-day releases (dependabot-style upgrades,
# lockfile committed, CI installs with --frozen-lockfile), so pnpm's default
# 24h minimum-release-age cooldown is disabled. The trade-off is intentional:
# fresh versions are reviewed through PRs instead of a time gate.
minimumReleaseAge: 0

# pnpm >= 10 blocks dependency build scripts by default; these need to run
# their install/postinstall steps (esbuild downloads native binaries,
# protobufjs runs codegen, sharp ships prebuilds).
allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true

# Formerly in .npmrc. pnpm >= 12 only reads auth/registry settings from
# .npmrc, so the node_modules-shaping settings live here now.
autoInstallPeers: true
strictPeerDependencies: false
shamefullyHoist: true
preferWorkspacePackages: true
linkWorkspacePackages: true

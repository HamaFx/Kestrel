    <text x="14" y="44" class="title">Virtual Broker &amp; Live Fills</text>
    <line x1="14" y1="54" x2="201" y2="54" stroke="#262729" />
    <text x="14" y="74" class="desc">• Dual Accounts: Personal (Confirm)</text>
    <text x="14" y="90" class="desc">  vs AI Agent Sandbox (Autonomous)</text>
    <text x="14" y="112" class="desc">• Sub-Second TickBus Fill Engine</text>
    <text x="14" y="132" class="desc">• 1m Cron Fallback Market Watch</text>
    <text x="14" y="152" class="desc">• Break-Even @ R + Trailing Ratchet</text>
    <text x="14" y="172" class="desc">• Auto-Sync Closed Trades → Journal</text>
    <text x="14" y="192" class="tag" fill="#d98f00">numeric(20,8) Accounting</text>
  </g>

  <path d="M 760 154 L 785 220" stroke="#3f9e3d" stroke-width="1.5" />
  <path d="M 760 374 L 785 280" stroke="#d98f00" stroke-width="1.5" />
  <polygon points="782,276 790,278 784,284" fill="#d98f00" />

  <!-- COLUMN 4: ALERTS, JOURNAL & TELEGRAM -->
  <g transform="translate(790, 62)" filter="url(#sh2)">
    <rect width="186" height="414" rx="12" fill="url(#card2)" stroke="#441c14" stroke-width="1.5" />
    <rect x="0" y="0" width="186" height="3" rx="1.5" fill="url(#emberBar2)" />
    <text x="14" y="24" class="tag" fill="#ff3616">04 · TRADER LOOP</text>
    <text x="14" y="44" class="title">Alerts, Journal &amp; Bot</text>
    <line x1="14" y1="54" x2="172" y2="54" stroke="#262729" />

    <text x="14" y="78" class="title" fill="#4fa3b5">Alert Evaluator (1m)</text>
    <text x="14" y="96" class="desc">Price, RSI, EMA &amp; Candle</text>
    <text x="14" y="112" class="desc">crossings + 90d Preview</text>

    <text x="14" y="144" class="title" fill="#3f9e3d">Multi-Channel Delivery</text>
    <text x="14" y="162" class="desc">• Web Push (VAPID)</text>
    <text x="14" y="178" class="desc">• Resend Email</text>
    <text x="14" y="194" class="desc">• Telegram Bot Push</text>

    <text x="14" y="226" class="title" fill="#d98f00">Trade Journal &amp; Replay</text>
    <text x="14" y="244" class="desc">• MFE / MAE Bar Replay</text>
    <text x="14" y="260" class="desc">• AI Trade Review &amp; Coach</text>
    <text x="14" y="276" class="desc">• Underwater Drawdown</text>

    <text x="14" y="308" class="title" fill="#ff632a">Telegram Copilot</text>
    <text x="14" y="326" class="desc">• Linked Chat Auth Guard</text>
    <text x="14" y="342" class="desc">• /ask &amp; /analyze Commands</text>
    <text x="14" y="358" class="desc">• Daily Morning Briefings</text>

    <rect x="14" y="376" width="158" height="24" rx="6" fill="#0d0e10" stroke="#262729" />
    <text x="93" y="392" text-anchor="middle" class="tag" fill="#ff3616">pgvector Memory Recall</text>

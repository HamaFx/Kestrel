name: nightly-tests

# Deep test pass that is too heavy for every PR:
#   - Full Playwright e2e across every browser project (Firefox, WebKit and
#     both mobile emulations in addition to Chromium).
#   - k6 API smoke suite against a production build with a real database,
#     seeded load-test users and seeded live ticks (the exact recipe
#     validated in loadtest/README.md).
#
# PR jobs stay fast; anything slow-but-important runs here once a night.
# The pipeline the k6 job runs was validated end-to-end locally:
# migrate -> seed users -> seed ticks -> build -> serve -> k6 smoke (0
# failed requests, all checks green).

permissions:
  contents: read

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-tests
  cancel-in-progress: false

jobs:
  e2e-all-browsers:
    name: Playwright E2E (all browsers, Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hamafx
          POSTGRES_USER: hamafx
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hamafx -d hamafx" --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://hamafx:test@localhost:5432/hamafx
      DIRECT_URL: postgres://hamafx:test@localhost:5432/hamafx
      ADMIN_DATABASE_URL: postgres://hamafx:test@localhost:5432/hamafx
      AUTH_SECRET: e2e-ci-auth-secret-must-be-at-least-32-chars!!
      CRON_SECRET: e2e-ci-cron-secret-must-be-at-least-32-chars!!
      ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MULTI_USER_ENABLED: '1'
      KESTREL_ENABLE_RLS: '1'
      KESTREL_LOCAL_DOCKER: 'true'
      REGISTRATION_MODE: open
      DB_DISABLE_SSL: 'true'
      ALLOW_INSECURE_LOCAL_TLS: '1'
      NEXT_BUILD_SKIP_TYPECHECK: '1'
      # Secondary browser projects are opt-in outside CI; the nightly run is
      # exactly that (see apps/web/playwright.config.ts).
      PLAYWRIGHT_ALL_BROWSERS: '1'
      PLAYWRIGHT_WEBSERVER_COMMAND: pnpm start
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Turborepo and Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-turbo-nightly-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-nightly-e2e-
            ${{ runner.os }}-turbo-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-all-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-all-
            ${{ runner.os }}-playwright-
      - name: Install browsers for Playwright
        run: pnpm --filter @kestrel/web exec playwright install --with-deps chromium firefox webkit
      - name: Build workspace (packages + web)
        run: pnpm turbo run build --filter=@kestrel/web...
        env:
          NEXT_BUILD_SKIP_TYPECHECK: '1'
      - name: Run Playwright E2E shard (all browsers)
        run: >-
          pnpm --filter @kestrel/web exec playwright test
          --project=setup
          --project=chromium
          --project=mobile-chrome
          --project=firefox
          --project=webkit
          --project=mobile-safari
          --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-nightly-report-${{ strategy.job-index }}
          path: apps/web/test-results/
          retention-days: 7

  k6-smoke:
    name: k6 API Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hamafx
          POSTGRES_USER: hamafx
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hamafx -d hamafx" --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://hamafx:test@localhost:5432/hamafx
      DIRECT_URL: postgres://hamafx:test@localhost:5432/hamafx
      ADMIN_DATABASE_URL: postgres://hamafx:test@localhost:5432/hamafx
      AUTH_SECRET: e2e-ci-auth-secret-must-be-at-least-32-chars!!
      CRON_SECRET: e2e-ci-cron-secret-must-be-at-least-32-chars!!
      ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MULTI_USER_ENABLED: '1'
      KESTREL_ENABLE_RLS: '1'
      KESTREL_LOCAL_DOCKER: 'true'
      REGISTRATION_MODE: open
      DB_DISABLE_SSL: 'true'
      ALLOW_INSECURE_LOCAL_TLS: '1'
      NEXT_BUILD_SKIP_TYPECHECK: '1'
      # Without a running worker, seeded ticks must still look fresh to the
      # live-ticks provider (mirrors loadtest/docker-compose.loadtest.yml).
      LIVE_TICKS_MAX_AGE_MS: '86400000'
      K6_BASE_URL: http://127.0.0.1:3000
      K6_USER_COUNT: '5'
      K6_TEST_PASSWORD: LoadTest!123
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Turborepo and Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-turbo-nightly-k6-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-nightly-k6-
            ${{ runner.os }}-turbo-
      - name: Build workspace (packages + web)
        run: pnpm turbo run build --filter=@kestrel/web...
        env:
          NEXT_BUILD_SKIP_TYPECHECK: '1'
      - name: Apply database migrations
        run: pnpm --filter @kestrel/db migrate:apply
      - name: Seed live ticks (no worker in CI)
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=test \
            -v "$PWD/loadtest/seed-live-ticks.sql:/seed.sql:ro" \
            pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b \
            psql -h 127.0.0.1 -U hamafx -d hamafx -f /seed.sql
      - name: Seed load-test users
        run: K6_ALLOW_SEED=true pnpm --filter @kestrel/loadtest seed
      - name: Build k6 bundles
        run: pnpm --filter @kestrel/loadtest build
      - name: Start web server
        run: |
          nohup pnpm --filter @kestrel/web start > /tmp/kestrel-web.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000/api/health/public > /dev/null; then
              echo "server healthy after ${i} probe(s)"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become healthy in time"
          tail -50 /tmp/kestrel-web.log
          exit 1
      - name: Run k6 smoke suite
        run: |
          mkdir -p loadtest/results && chmod 777 loadtest/results
          docker run --rm --network host \
            -e K6_BASE_URL -e K6_USER_COUNT -e K6_TEST_PASSWORD \
            -v "$PWD/loadtest:/work" -w /work \
            grafana/k6@sha256:3e4186aea62e11a45560bfc51e19eeafe82fc07ce069c78aff44b7ff893d9a5e \
            run dist/tests/smoke-all.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-smoke-results
          path: loadtest/results/
          retention-days: 7
